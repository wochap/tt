[workspace]
resolver = "3"
members = [
    "crates/automerge_repo",
    "crates/tt-core",
    "crates/tt-daemon",
    "crates/tt-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
automerge-repo = { path = "crates/automerge_repo" }
tt-core = { path = "crates/tt-core" }
tt-daemon = { path = "crates/tt-daemon" }
anyhow = "1"
async-trait = "0.1"
automerge = "=0.11.0"
bs58 = { version = "0.5", features = ["check"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
ciborium = "0.2"
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
dialoguer = { version = "0.12", default-features = false, features = ["fuzzy-select", "password"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
iana-time-zone = "0.1"
nucleo-matcher = "0.3"
proptest = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.30"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
