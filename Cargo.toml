[workspace]
resolver = "3"
members = [
    "crates/automerge_repo",
    "crates/tt-core",
    "crates/tt-daemon",
    "crates/tt-cli",
    "crates/tt-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
automerge-repo = { path = "crates/automerge_repo" }
tt-core = { path = "crates/tt-core" }
tt-daemon = { path = "crates/tt-daemon" }
tt-server = { path = "crates/tt-server" }
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
base64 = "0.22"
automerge = "=0.11.0"
bs58 = { version = "0.5", features = ["check"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
ciborium = "0.2"
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
dialoguer = { version = "0.12", default-features = false, features = ["fuzzy-select", "password"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
iana-time-zone = "0.1"
nucleo-matcher = "0.3"
proptest = "1"
rcgen = "0.14"
ring = "0.17"
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc", "std"] }
webpki-root-certs = "1"
